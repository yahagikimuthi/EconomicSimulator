services:
  # C++
  cpp:
    build:
      context: ./simulator/.devcontainer
    volumes:
      - ./simulator:/app
      - /app/build
    tty: true

  # Go
  go:
    build:
      context: ./backend/.devcontainer
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - cpp

  # フロントエンド
  frontend:
    build:
      context: ./frontend/.devcontainer
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true