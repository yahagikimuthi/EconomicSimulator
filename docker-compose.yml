services:
  # C++
  simulator-cpp:
    build:
      context: ./simulator
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-./}/simulator:/app
    working_dir: /app
    tty: true

  # Go
  backend-go:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - simulator-cpp

  # フロントエンド
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true